<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dental Tool Recognition - Educational Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🦷 Dental Tool Quiz</h1>

    <!-- Difficulty Selection -->
    <div id="difficultyScreen">
        <h2>Select Difficulty</h2>
        <button class="difficultyBtn" data-level="easy">Easy (2 options)</button>
        <button class="difficultyBtn" data-level="medium">Medium (4 options)</button>
        <button class="difficultyBtn" data-level="hard">Hard (6 options)</button>
        <button class="difficultyBtn" data-level="expert">Expert (All 6)</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" style="display: none;">
        
        <!-- Score Display -->
        <div id="scoreBoard">
            <div class="scoreItem">
                <span class="scoreLabel">Score:</span>
                <span id="score">0</span>
            </div>
            <div class="scoreItem">
                <span class="scoreLabel">Streak:</span>
                <span id="streak">0</span>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage"></div>

        <!-- Camera View -->
        <div id="cameraContainer">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" width="224" height="224"></canvas>
            <div id="detectionOverlay">
                <p id="detectedTool">Show a tool...</p>
                <div id="stabilityBar">
                    <div id="stabilityProgress"></div>
                </div>
            </div>
        </div>

        <!-- Instruction -->
        <p id="instruction">Present a dental tool to the camera</p>

        <!-- Diagram Options -->
        <div id="diagramOptions"></div>

        <!-- Feedback -->
        <div id="feedback"></div>

        <!-- Next Button -->
        <button id="nextRoundBtn" style="display: none;">Next Tool</button>

    </div>

    <!-- Load libraries in correct order -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="teachablemachine-image.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
